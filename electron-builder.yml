appId: dev.horizonbrasil.pokeidlepanel
productName: PokeIdle Panel
directories:
  buildResources: build
  output: dist
files:
  - out/**
  - package.json
asar: true
publish:
  provider: github
  owner: gabrielsvpinheiro
  repo: pokeidle-panel
mac:
  category: public.app-category.games
  icon: build/icon.png
  target:
    - target: dmg
      arch: [arm64, x64]
  artifactName: PokeIdle-Panel-mac-${arch}.${ext}
dmg:
  title: ${productName} ${version}
win:
  icon: build/icon.png
  target:
    - target: nsis
      arch: [x64]
  artifactName: PokeIdle-Panel-win-${arch}.${ext}
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
